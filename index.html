let settings={n:3,time:60,names:['Пифагор','Тьюринг','Ньютон','Эйнштейн']};
function capture(){if($('count')){settings.n=+$('count').value;settings.time=+$('duration').value;document.querySelectorAll('.nameinput').forEach((x,i)=>settings.names[i]=x.value)}}
function setup(){return `<section class="hero"><div class="eyebrow">${T('ШКОЛЬНАЯ НЕДЕЛЯ МИФ','МЕКТЕПТЕГІ МИФ АПТАЛЫҒЫ')}</div><h1>${T('Большая <span>битва умов.</span>','Үлкен <span>зияткерлер сайысы.</span>')}</h1><p>${T('Три науки. Шесть категорий. Одна команда победителей. Соберите команды и превратите знания в яркую игру.','Үш ғылым. Алты санат. Бір жеңімпаз команда. Команда құрып, білімдеріңді қызықты ойында сынаңдар.')}</p><span class="pill">7–9 ${T('классы · 30 вопросов · 35–50 минут','сыныптар · 30 сұрақ · 35–50 минут')}</span></section><section class="setup"><div class="panel"><h2>01 / ${T('Соберите команды','Командаларды құрыңдар')}</h2><label class="formrow">${T('Количество команд','Командалар саны')}<select id="count" onchange="capture();render()">${[2,3,4].map(n=>`<option ${settings.n===n?'selected':''}>${n}</option>`).join('')}</select></label><div class="names">${settings.names.slice(0,settings.n).map((n,i)=>`<input class="nameinput" aria-label="${T('Команда','Команда')} ${i+1}" maxlength="24" value="${esc(n)}">`).join('')}</div><label class="formrow">${T('Время на вопрос','Сұраққа берілетін уақыт')}<select id="duration">${[30,60,90].map(n=>`<option value="${n}" ${settings.time===n?'selected':''}>${n} ${T('сек','сек')}</option>`).join('')}</select></label><button class="primary start" onclick="start()">${T('Начать игру →','Ойынды бастау →')}</button></div><div class="panel"><h2>02 / ${T('Правила арены','Ойын ережелері')}</h2><ol class="rules"><li>${T('Команды по очереди выбирают вопрос за 100–500 баллов. Чем выше ставка, тем сложнее задача.','Командалар кезекпен 100–500 ұпайлық сұрақ таңдайды. Ұпай жоғарылаған сайын тапсырма қиындайды.')}</li><li>${T('Обсудите и ответьте вслух. Ведущий открывает ответ и оценивает: верно — баллы ваши, неверно — 0.','Ақылдасып, ауызша жауап беріңдер. Жүргізуші жауапты ашады: дұрыс болса ұпай беріледі, қате болса — 0.')}</li><li>${T('В финале каждая команда делает ставку. За верный ответ ставка прибавляется, за ошибку — вычитается.','Финалда әр команда ұпай тігеді. Дұрыс жауапта тігілген ұпай қосылады, қате жауапта шегеріледі.')}</li></ol><p class="hint">${T('Ведущий управляет игрой с одного компьютера. Прогресс сохраняется в этом браузере. Язык можно менять в любой момент.','Жүргізуші ойынды бір компьютерден басқарады. Ойын барысы осы браузерде сақталады. Тілді кез келген уақытта ауыстыруға болады.')}</p></div></section>`}
function start(){capture();state={teams:settings.names.slice(0,settings.n).map((n,i)=>({name:n.trim()||T('Команда ','Команда ')+(i+1),score:0})),turn:0,used:[],time:settings.time,phase:'board',final:null};history=[];save();render()}
function scorebar(){return `<div class="scores">${state.teams.map((t,i)=>`<button class="team ${state.turn===i?'current':''}" onclick="turn(${i})"><small>${esc(t.name)}</small><strong>${t.score}</strong></button>`).join('')}</div>`}
function turn(i){if(modal||state.phase!=='board')return;state.turn=i;save();render()}
function board(){return `<div class="boardtop"><div><div class="eyebrow">${T('ИГРОВОЕ ПОЛЕ','ОЙЫН АЛАҢЫ')}</div><h1>${T('Выбирайте. Думайте. Побеждайте.','Таңдаңдар. Ойланыңдар. Жеңіңдер.')}</h1></div><span class="pill">${state.used.length} / 30</span></div>${scorebar()}<div class="sub">${T('Сейчас выбирает','Қазір таңдайды')}: <b>${esc(state.teams[state.turn].name)}</b> · ${T('нажмите на команду, чтобы передать ход','кезекті беру үшін команданы басыңдар')}</div><div class="grid">${categories.map(c=>`<div class="cat"><i>${c[2]}</i>${c[L==='ru'?0:1]}</div>`).join('')}${[0,1,2,3,4].map(row=>categories.map((c,col)=>{let id=col*5+row;return `<button class="tile" ${state.used.includes(id)?'disabled':''} onclick="openQ(${id})" aria-label="${c[L==='ru'?0:1]} ${(row+1)*100}">${state.used.includes(id)?'✓':(row+1)*100}</button>`}).join('')).join('')}</div><div class="bottom"><button onclick="undo()" ${history.length?'':'disabled'}>↶ ${T('Отменить ход','Жүрісті қайтару')}</button><span class="hint">${T('Без штрафов в основном раунде','Негізгі кезеңде айып ұпайы жоқ')}</span><button class="primary" onclick="confirmFinal()">${T('Финальный раунд →','Финалдық кезең →')}</button><button class="danger" onclick="resetAsk()">${T('Новая игра','Жаңа ойын')}</button></div>`}
function render(){document.documentElement.lang=L;$('ru').className=L==='ru'?'active-lang':'';$('kk').className=L==='kk'?'active-lang':'';$('app').innerHTML=!state?setup():state.phase==='board'?board():state.phase==='final'?finalSetup():results()}
function openQ(id){if(state.used.includes(id)||modal)return;modal={type:'q',id};remaining=state.time;paused=false;revealed=false;drawModal();timer=setInterval(()=>{if(!paused&&!revealed&&remaining>0){remaining--;updateClock();if(!remaining){paused=true;updateClock()}}},1000)}
function updateClock(){if($('clock'))$('clock').textContent=remaining?`${remaining} ${T('с','с')}`:T('Время!','Уақыт бітті!');if($('bar'))$('bar').style.width=(remaining/state.time*100)+'%';if($('pause'))$('pause').textContent=paused?T('▶ Продолжить','▶ Жалғастыру'):T('Ⅱ Пауза','Ⅱ Кідірту')}
function drawModal(){const m=modal;if(!m)return;if(m.type==='q'){let c=Math.floor(m.id/5),r=m.id%5,q=raw[c][r],v=(r+1)*100;$('overlay').innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="${T('Вопрос','Сұрақ')}"><div class="qtop"><span class="pill">${categories[c][L==='ru'?0:1]} · ${v}</span><span>${esc(state.teams[state.turn].name)}</span><span class="clock" id="clock"></span></div><div class="progress"><div id="bar"></div></div><div class="question">${q[L==='ru'?0:1]}</div>${revealed?`<div class="answer"><h3>${q[L==='ru'?2:3]}</h3><p>${q[L==='ru'?4:5]}</p></div><div class="actions"><button class="award" onclick="grade(true)">✓ ${T('Верно','Дұрыс')} +${v}</button><button onclick="grade(false)">✕ ${T('Неверно / нет ответа','Қате / жауап жоқ')} · 0</button></div>`:`<div class="actions"><button class="primary" onclick="reveal()">${T('Открыть ответ','Жауапты ашу')}</button><button id="pause" onclick="paused=!paused;updateClock()"></button><button onclick="closeModal()">${T('Вернуться к полю','Алаңға оралу')}</button></div>`}<p class="hint">${T('Решение оценивает ведущий. Таймер можно приостановить для обсуждения.','Шешімді жүргізуші бағалайды. Талқылау үшін таймерді кідіртуге болады.')}</p></section></div>`;updateClock()}else if(m.type==='confirm'){ $('overlay').innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true"><h2>${m.title[L==='ru'?0:1]}</h2><p>${m.text[L==='ru'?0:1]}</p><div class="actions"><button class="primary" onclick="doConfirm()">${T('Продолжить','Жалғастыру')}</button><button onclick="closeModal()">${T('Отмена','Бас тарту')}</button></div></section></div>`}}
function closeModal(){clearInterval(timer);timer=null;modal=null;$('overlay').innerHTML=''}function reveal(){revealed=true;clearInterval(timer);drawModal()}function snapshot(){history.push(JSON.stringify(state));if(history.length>35)history.shift()}
function grade(ok){if(!modal||modal.type!=='q'||!revealed)return;snapshot();if(ok)state.teams[state.turn].score+=(modal.id%5+1)*100;state.used.push(modal.id);state.turn=(state.turn+1)%state.teams.length;closeModal();save();render()}
function undo(){if(!history.length)return;state=JSON.parse(history.pop());save();render()}
function confirmFinal(){modal={type:'confirm',action:'final',title:['Перейти в финал?','Финалға өту керек пе?'],text:[`Сыграно ${state.used.length} из 30 вопросов. После перехода поле вопросов закроется.`,`30 сұрақтың ${state.used.length} сұрағы ойналды. Өткеннен кейін сұрақтар алаңы жабылады.`]};drawModal()}
function resetAsk(){modal={type:'confirm',action:'reset',title:['Начать новую игру?','Жаңа ойын бастау керек пе?'],text:['Текущий результат будет сброшен.','Ағымдағы нәтиже жойылады.']};drawModal()}
function doConfirm(){let a=modal.action;closeModal();if(a==='reset'){state=null;history=[]}else{snapshot();state.phase='final';state.final={stage:'bets',bets:state.teams.map(()=>0),correct:state.teams.map(()=>false)}}save();render()}
const fq=['В турнире каждая команда сыграла с каждой другой ровно один раз. Всего состоялось 15 игр. Сколько команд участвовало?','Турнирде әр команда қалған әр командамен бір рет ойнады. Барлығы 15 ойын өтті. Неше команда қатысты?'];
function finalSetup(){let f=state.final;return `<section class="hero"><div class="eyebrow">${T('ФИНАЛ · ОБЩИЙ ВОПРОС','ФИНАЛ · ОРТАҚ СҰРАҚ')}</div><h1>${T('Рискните <span>знаниями.</span>','<span>Білімге</span> сеніңдер.')}</h1><p>${T('Тема: логика турнира. Запишите ответы на бумаге, чтобы команды не слышали друг друга. На обсуждение — 90 секунд; ведущий следит за временем.','Тақырып: турнир логикасы. Командалар бір-бірінің жауабын естімеуі үшін жауаптарды қағазға жазыңдар. Талқылауға — 90 секунд; уақытты жүргізуші бақылайды.')}</p></section>${scorebar()}<div class="panel">${f.stage==='bets'?`<h2>${T('Сделайте ставки','Ұпай тігіңдер')}</h2><p>${T('От 0 до всех накопленных баллов. Ставки фиксируются до открытия вопроса.','0-ден бастап жиналған барлық ұпайға дейін. Сұрақ ашылғанға дейін тігілген ұпай бекітіледі.')}</p>${state.teams.map((t,i)=>`<label class="formrow"><span>${esc(t.name)} <small>(${t.score})</small></span><input id="bid${i}" class="bid" type="number" min="0" max="${t.score}" step="1" value="${f.bets[i]}" oninput="state.final.bets[${i}]=Number(this.value);save()"></label>`).join('')}<p id="error" class="danger" role="alert"></p><button class="primary" onclick="lockBets()">${T('Зафиксировать и открыть вопрос','Бекіту және сұрақты ашу')}</button>`:`<div class="question">${fq[L==='ru'?0:1]}</div>${f.stage==='question'?`<button class="primary" onclick="state.final.stage='answer';save();render()">${T('Все ответы сданы — открыть решение','Барлық жауап тапсырылды — шешімді ашу')}</button>`:`<div class="answer"><h3>${T('6 команд','6 команда')}</h3><p>${T('Каждая из n команд играет с n − 1 соперниками. Делим на 2, чтобы не считать матчи дважды: n(n − 1)/2 = 15. При n = 6 получаем 6 × 5 / 2 = 15.','Әрбір n команда n − 1 қарсыласпен ойнайды. Ойындарды екі рет санамау үшін 2-ге бөлеміз: n(n − 1)/2 = 15. n = 6 болса, 6 × 5 / 2 = 15.')}</p></div><p>${T('Отметьте команды с верным ответом. У остальных ставка вычитается.','Дұрыс жауап берген командаларды белгілеңдер. Қалғандарының тіккен ұпайы шегеріледі.')}</p>${state.teams.map((t,i)=>`<label class="formrow"><span>${esc(t.name)} · ${T('ставка','тігілген ұпай')}: ${f.bets[i]}</span><input type="checkbox" style="width:25px;height:25px" ${f.correct[i]?'checked':''} onchange="state.final.correct[${i}]=this.checked;save()"></label>`).join('')}<button class="primary start" onclick="finish()">${T('Показать победителей ✦','Жеңімпаздарды көрсету ✦')}</button>`}`}</div>`}
function lockBets(){let b=state.teams.map((_,i)=>Number($('bid'+i).value));if(b.some((n,i)=>!Number.isInteger(n)||n<0||n>state.teams[i].score)){$('error').textContent=T('Ставка должна быть целым числом от 0 до баллов команды.','Тігілетін ұпай 0 мен команда ұпайының арасындағы бүтін сан болуы керек.');return}state.final.bets=b;state.final.stage='question';save();render()}
function finish(){state.teams.forEach((t,i)=>t.score+=state.final.correct[i]?state.final.bets[i]:-state.final.bets[i]);state.phase='results';save();render()}
function results(){let ranked=state.teams.map(t=>({...t})).sort((a,b)=>b.score-a.score),top=ranked.filter(t=>t.score===ranked[0].score);return `<section class="ranking"><div class="eyebrow">${T('ИГРА ЗАВЕРШЕНА','ОЙЫН АЯҚТАЛДЫ')}</div><div style="font-size:65px;margin-top:30px">🏆</div><h1>${T('Вот это <span>команда!</span>','Нағыз <span>зияткерлер!</span>')}</h1><p>${T(top.length>1?'Разделили первое место:':'Победитель:',top.length>1?'Бірінші орынды бөлісті:':'Жеңімпаз:')} <b>${top.map(t=>esc(t.name)).join(' & ')}</b></p><div class="podium">${ranked.map((t,i)=>`<div class="rank"><span>${1+ranked.filter(x=>x.score>t.score).length}. ${esc(t.name)}</span><b>${t.score}</b></div>`).join('')}</div><button class="primary" onclick="resetAsk()">${T('Сыграть ещё раз →','Қайта ойнау →')}</button></section>`}
async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal&&modal.type==='confirm')closeModal()});render();
</script></html>
